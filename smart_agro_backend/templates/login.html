{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Smart Agro</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-green-50 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-2xl shadow-lg w-96">

<h2 class="text-2xl font-bold text-center text-green-700 mb-6">
Welcome Farmer 👋
</h2>

<form id="loginForm">
{% csrf_token %}

<input
type="text"
placeholder="Mobile or Email"
class="w-full mb-3 p-3 border rounded-lg"
required
/>

<input
type="password"
placeholder="Password"
class="w-full mb-4 p-3 border rounded-lg"
required
/>

<button
type="submit"
class="w-full bg-green-700 text-white p-3 rounded-lg font-semibold">
Login
</button>

</form>

<p class="text-sm text-center mt-4">
New user?
<a href="/signup/" class="text-green-700 font-semibold">
Sign Up
</a>
</p>

</div>

<script>

function getCookie(name) {
let cookieValue = null;
if (document.cookie && document.cookie !== '') {
const cookies = document.cookie.split(';');
for (let i = 0; i < cookies.length; i++) {
const cookie = cookies[i].trim();
if (cookie.substring(0, name.length + 1) === (name + '=')) {
cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
break;
}
}
}
return cookieValue;
}

const csrftoken = getCookie('csrftoken');

document.getElementById("loginForm").onsubmit = async function(e){

e.preventDefault();

const data = {
mobile_or_email: e.target[0].value,
password: e.target[1].value
};

const res = await fetch("/api/login/", {
method: "POST",
headers: {
"Content-Type": "application/json",
"X-CSRFToken": csrftoken
},
body: JSON.stringify(data)
});

const result = await res.json();

if(res.ok){
localStorage.setItem("username", result.username);
window.location.href="/home/";
}
else{
localStorage.setItem("username", result.username);
window.location.href="/home/";
}

};

</script>

</body>
</html>
