{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up - Smart Agro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-green-50 flex items-center justify-center h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-96">
    
    <h2 class="text-2xl font-bold text-center text-green-700 mb-6">
      Smart Agro Assistant
    </h2>

<form id="signupForm">

      <input type="text" placeholder="Username"
        class="w-full mb-3 p-3 border rounded-lg" />

      <input type="text" placeholder="Mobile or Email"
        class="w-full mb-3 p-3 border rounded-lg" />

      <input type="password" placeholder="Password"
        class="w-full mb-4 p-3 border rounded-lg" />

      <button
        class="w-full bg-green-700 text-white p-3 rounded-lg font-semibold">
        Sign Up
      </button>

    </form>

    <p class="text-sm text-center mt-4">
      Already have account?
      <a href="/" class="text-green-700 font-semibold">
        Login
      </a>
    </p>

  </div>
<script>
function getCookie(name) {
let cookieValue = null;
if (document.cookie && document.cookie !== '') {
const cookies = document.cookie.split(';');
for (let i = 0; i < cookies.length; i++) {
const cookie = cookies[i].trim();
if (cookie.substring(0, name.length + 1) === (name + '=')) {
cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
break;
}
}
}
return cookieValue;
}

const csrftoken = getCookie('csrftoken');

document.getElementById("signupForm").onsubmit = async function(e){

e.preventDefault();

const data = {
username: e.target[0].value,
mobile: e.target[1].value,
password: e.target[2].value
};

const res = await fetch("/api/signup/", {
method: "POST",
headers: {
"Content-Type": "application/json",
"X-CSRFToken": csrftoken
},
body: JSON.stringify(data)
});

const result = await res.json();

if(res.ok){
alert("Signup successful");
window.location.href = "/";
}
else{
alert(JSON.stringify(result));
}

};
</script>

</body>
</html>
